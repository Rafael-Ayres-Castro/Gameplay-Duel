<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <meta name="color-scheme" content="dark">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Desafio Gameplay</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <!-- Sprite de ícones (linha, 24x24, herdam currentColor) -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <!-- Jogos -->
      <symbol id="g-fifa" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.8 2.8-1.5 4.4H9.7L8.2 10.3z"/><path d="M12 7.5V3.2M15.8 10.3l4.1-1.4M14.3 14.7l2.6 3.6M9.7 14.7l-2.6 3.6M8.2 10.3L4.1 8.9"/></symbol>
      <symbol id="g-rocket_league" viewBox="0 0 24 24"><path d="M3 15.5v-2.2c0-.7.4-1.2 1-1.4l3.2-1 2.6-2.6c.4-.4.9-.6 1.4-.6h4.3c.6 0 1.1.3 1.4.8l1.6 2.6 1.6.4c.8.2 1.4.9 1.4 1.7v2.3"/><path d="M3 15.5h1.6M9.2 15.5h5.6M19.4 15.5H21"/><circle cx="7" cy="15.8" r="2.2"/><circle cx="17" cy="15.8" r="2.2"/><circle cx="19" cy="4.6" r="2"/><path d="M1.5 12h1M1 9.5h2.5"/></symbol>
      <symbol id="g-clash_royale" viewBox="0 0 24 24"><path d="M4 8l3.5 3L12 5l4.5 6L20 8l-1.6 9H5.6z"/><path d="M5.6 20h12.8"/><circle cx="12" cy="13.4" r="1.2"/></symbol>
      <symbol id="g-minecraft" viewBox="0 0 24 24"><path d="M12 3l8 4.5v9L12 21l-8-4.5v-9z"/><path d="M4 7.5l8 4.5 8-4.5M12 12v9"/><path d="M4 9.8l2.7 1.5v1.4l2.6 1.5v-1.1l2.7 1.5M20 9.8l-2.7 1.5v1.4l-2.6 1.5v-1.1L12 14.6"/></symbol>
      <symbol id="g-fall_guys" viewBox="0 0 24 24"><path d="M7 9.5a5 5 0 0 1 10 0V17a4 4 0 0 1-4 4h-2a4 4 0 0 1-4-4z"/><rect x="8.6" y="8" width="6.8" height="4.4" rx="2.2"/><path d="M10.5 10.2h.01M13.5 10.2h.01" stroke-width="2.4"/><path d="M7 14l-2.2 1.6M17 14l2.2 1.6M10.5 21v1.5M13.5 21v1.5"/></symbol>
      <symbol id="g-gang_beasts" viewBox="0 0 24 24"><path d="M6.5 11c0-3.3 2.4-5.5 5.5-5.5s5.5 2.2 5.5 5.5v4.5c0 2.2-1.6 4-3.6 4H10c-2 0-3.5-1.8-3.5-4z"/><path d="M10 11h.01M14 11h.01" stroke-width="2.4"/><path d="M10.4 14.6c1 .7 2.2.7 3.2 0"/><path d="M6.5 13.2L4.3 10.8M17.5 13.2l2.2-2.4"/><circle cx="3.6" cy="9.4" r="1.5"/><circle cx="20.4" cy="9.4" r="1.5"/></symbol>
      <symbol id="g-plato" viewBox="0 0 24 24"><path d="M6.5 4h11A2.5 2.5 0 0 1 20 6.5v7a2.5 2.5 0 0 1-2.5 2.5H10l-4 3.5V16h.5A2.5 2.5 0 0 1 4 13.5v-7A2.5 2.5 0 0 1 6.5 4z"/><path d="M9 7.6h.01M12 10h.01M15 12.4h.01" stroke-width="2.6"/></symbol>

      <!-- Interface -->
      <symbol id="i-grid" viewBox="0 0 24 24"><rect x="4" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="4" width="6.5" height="6.5" rx="1.5"/><rect x="4" y="13.5" width="6.5" height="6.5" rx="1.5"/><rect x="13.5" y="13.5" width="6.5" height="6.5" rx="1.5"/></symbol>
      <symbol id="i-list" viewBox="0 0 24 24"><path d="M9 6h11M9 12h11M9 18h11M4.5 6h.01M4.5 12h.01M4.5 18h.01" /></symbol>
      <symbol id="i-pad" viewBox="0 0 24 24"><path d="M7 8h10a4 4 0 0 1 4 4v1.5a3 3 0 0 1-5.3 1.9L14.5 14h-5l-1.2 1.4A3 3 0 0 1 3 13.5V12a4 4 0 0 1 4-4z"/><path d="M8 10.5v3M6.5 12h3M15.5 11h.01M17.2 12.8h.01"/></symbol>
      <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
      <symbol id="i-sliders" viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h3M13 17h7"/><circle cx="16" cy="7" r="2.4"/><circle cx="10" cy="17" r="2.4"/></symbol>
      <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></symbol>
      <symbol id="i-chev-r" viewBox="0 0 24 24"><path d="M9.5 6l6 6-6 6"/></symbol>
      <symbol id="i-chev-l" viewBox="0 0 24 24"><path d="M14.5 6l-6 6 6 6"/></symbol>
      <symbol id="i-chev-d" viewBox="0 0 24 24"><path d="M6 9.5l6 6 6-6"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.3-4.3"/></symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5v1.2A3.3 3.3 0 0 0 8.3 10.5M16 6h3v1.2a3.3 3.3 0 0 1-3.3 3.3M12 13v3.5M9 20h6M10 16.5h4V20h-4z"/></symbol>
      <symbol id="i-crown" viewBox="0 0 24 24"><path d="M4 8l3.5 3L12 5l4.5 6L20 8l-1.6 9H5.6z"/></symbol>
      <symbol id="i-swords" viewBox="0 0 24 24"><path d="M4 4l10.5 10.5M20 4L9.5 14.5M12.5 17l5-5M6.5 12l5 5M16 16l4 4M8 16l-4 4"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></symbol>
      <symbol id="i-cal" viewBox="0 0 24 24"><rect x="4" y="5.5" width="16" height="14.5" rx="2"/><path d="M4 10h16M8.5 3.5v4M15.5 3.5v4"/></symbol>
      <symbol id="i-trash" viewBox="0 0 24 24"><path d="M5 7h14M10 7V4.5h4V7M7 7l.8 12.5h8.4L17 7M10.5 11v5M13.5 11v5"/></symbol>
      <symbol id="i-bolt" viewBox="0 0 24 24"><path d="M13 3L5 13.5h6L10 21l8-10.5h-6z"/></symbol>
      <symbol id="i-filter" viewBox="0 0 24 24"><path d="M4 5h16l-6 7.5V19l-4-2v-4.5z"/></symbol>
      <symbol id="i-key" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2.5 2.5M14 9l1.8 1.8"/></symbol>
      <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></symbol>
      <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 19h16M6.5 15l3.5-4.5 3 2.5 4.5-6.5"/></symbol>
      <symbol id="i-target" viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></symbol>
      <symbol id="i-flag" viewBox="0 0 24 24"><path d="M5 21V4M5 4h11l-2 4 2 4H5"/></symbol>
      <symbol id="i-note" viewBox="0 0 24 24"><path d="M6 3.5h8.5L19 8v12.5H6z"/><path d="M14 3.5V8h5M9 12.5h7M9 16h5"/></symbol>
    </defs>
  </svg>

  <div class="frame" id="frame">
    <header class="topbar">
      <a class="brand" href="#/dashboard" aria-label="Início">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name" id="brandName">DESAFIO GAMEPLAY</span>
      </a>

      <nav class="seg seg-top" aria-label="Navegação">
        <a href="#/dashboard" data-nav="dashboard" class="seg-item">Dashboard</a>
        <a href="#/partidas" data-nav="partidas" class="seg-item">Partidas</a>
        <a href="#/jogos" data-nav="jogos" class="seg-item">Jogos</a>
      </nav>

      <div class="top-actions">
        <button class="icon-btn" data-action="open-settings" aria-label="Configurar jogadores">
          <svg class="ico"><use href="#i-sliders"/></svg>
        </button>
        <button class="btn btn-mint btn-register" data-action="open-register">
          <svg class="ico"><use href="#i-plus"/></svg><span>Registrar partida</span>
        </button>
      </div>
    </header>

    <main id="view" class="view" aria-live="polite">
      <div class="loading">
        <span class="loader" aria-hidden="true"></span>
        <span>Carregando campeonato...</span>
      </div>
    </main>

    <footer class="footer">
      <span class="footer-brand" id="footerBrand">DESAFIO GAMEPLAY</span>
      <span class="footer-sep" aria-hidden="true"></span>
      <span class="muted" id="footerMode">APP v1.0</span>
      <span class="footer-spacer"></span>
      <a href="/api/docs" class="footer-link" target="_blank" rel="noopener">API</a>
    </footer>
  </div>

  <!-- Navegação inferior no celular -->
  <nav class="tabbar" aria-label="Navegação">
    <a href="#/dashboard" data-nav="dashboard" class="tab"><svg class="ico"><use href="#i-grid"/></svg><span>Dashboard</span></a>
    <a href="#/partidas" data-nav="partidas" class="tab"><svg class="ico"><use href="#i-list"/></svg><span>Partidas</span></a>
    <button class="tab tab-cta" data-action="open-register" aria-label="Registrar partida"><span class="tab-cta-inner"><svg class="ico"><use href="#i-plus"/></svg></span></button>
    <a href="#/jogos" data-nav="jogos" class="tab"><svg class="ico"><use href="#i-pad"/></svg><span>Jogos</span></a>
    <button class="tab" data-action="open-settings"><svg class="ico"><use href="#i-sliders"/></svg><span>Jogadores</span></button>
  </nav>

  <div id="modalRoot"></div>
  <div id="toastRoot" class="toast-root" aria-live="assertive"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
